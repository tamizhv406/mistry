<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="%APP_DESCRIPTION%" />
    <meta name="theme-color" content="%BRAND_PRIMARY%" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="%APP_SHORT_NAME%" />
    <meta name="application-name" content="%APP_NAME%" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>%APP_NAME% — %APP_TAGLINE%</title>
    <script>
      (function() {
        var params = new URLSearchParams(window.location.search);
        var redirect = params.get('p');
        if (redirect) {
          window.history.replaceState(null, null,
            window.location.pathname.slice(0, -1) + decodeURIComponent(redirect) + window.location.hash
          );
        }
      })();
    </script>
    <style>
      /* Shown until the app starts (also offline): the same splash the app shows while it checks the sign-in. */
      .boot-shell { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 16px; background: %BRAND_BACKGROUND%; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center; }
      .boot-logo { display: flex; width: 80px; height: 80px; }
      .boot-logo svg { width: 80px; height: 80px; }
      .boot-name { margin-top: -2px; font-weight: 800; font-size: 30px; color: %BRAND_DARK%; letter-spacing: -0.01em; }
      .boot-text { display: inline-flex; align-items: center; gap: 10px; margin: 0; color: #57534E; font-size: 15px; font-weight: 600; }
      .boot-spinner { width: 18px; height: 18px; border: 2.5px solid %BRAND_PRIMARY%; border-right-color: transparent; border-radius: 50%; animation: bootSpin 0.7s linear infinite; }
      @keyframes bootSpin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-spinner { animation-duration: 2s; } }
    </style>
  </head>
  <body>
    <!-- Shown until the app starts (also offline), so opening the app never shows a blank screen. -->
    <div id="root"><div class="boot-shell" aria-busy="true" aria-label="Loading %APP_NAME%">
      <span class="boot-logo">%APP_LOGO_SVG%</span>
      <span class="boot-name">%APP_NAME%</span>
      <p class="boot-text"><span class="boot-spinner" aria-hidden="true"></span>Loading…</p>
    </div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
